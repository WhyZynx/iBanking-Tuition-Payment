server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose service names dynamically after backend containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/v1/internal/ {
        return 404;
    }

    location ~ ^/api/v1/tuition/[^/]+/(claim(/[^/]+)?|pay)$ {
        return 404;
    }

    location /api/v1/tuition {
        set $tuition_upstream tuition-service:8002;
        proxy_pass http://$tuition_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/payments {
        set $payment_upstream payment-service:8003;
        proxy_pass http://$payment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/transactions {
        set $payment_upstream payment-service:8003;
        proxy_pass http://$payment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        set $user_upstream user-service:8001;
        proxy_pass http://$user_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
